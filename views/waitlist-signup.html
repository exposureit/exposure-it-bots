<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Waitlist — Exposure It</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 560px; margin: 40px auto; padding: 20px; }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand h1 { font-size: 22px; letter-spacing: 1px; }
    .brand p { color: #888; font-size: 13px; margin-top: 4px; }
    form { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
    .label-sub { font-weight: 400; color: #888; font-size: 12px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #252525; box-shadow: 0 0 0 2px rgba(37,37,37,0.08); }
    textarea { resize: vertical; min-height: 50px; }
    .date-range { display: none; gap: 12px; }
    .date-range.visible { display: flex; }
    .date-range .form-group { flex: 1; margin-bottom: 0; }
    .duration-display { background: #f8f8f8; border: 1px solid #e8e8e8; border-radius: 6px; padding: 10px 14px; font-size: 14px; color: #444; display: none; }
    .duration-display.visible { display: block; }
    .duration-display strong { color: #252525; }
    .radio-group { display: flex; gap: 16px; flex-wrap: wrap; }
    .radio-group label { font-weight: 400; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .radio-group input { width: auto; }
    button { width: 100%; padding: 14px; background: #252525; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #000; }
    button:disabled { background: #999; cursor: not-allowed; }
    .success { display: none; background: #f0fdf4; border: 1px solid #86efac; padding: 24px; border-radius: 12px; text-align: center; }
    .success h2 { color: #16a34a; margin-bottom: 8px; font-size: 20px; }
    .success p { color: #475569; line-height: 1.5; }
    .error { display: none; background: #fef2f2; border: 1px solid #fca5a5; padding: 12px; border-radius: 6px; color: #dc2626; margin-bottom: 16px; font-size: 14px; }
    .duplicate { display: none; background: #fffbeb; border: 1px solid #fbbf24; padding: 12px; border-radius: 6px; color: #92400e; margin-bottom: 16px; font-size: 14px; }
    .note { text-align: center; color: #999; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>EXPOSURE IT</h1>
      <p>Join the Waitlist</p>
    </div>

    <div class="error" id="error"></div>
    <div class="duplicate" id="duplicate"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="agentName">Your Name *</label>
        <input type="text" id="agentName" name="agentName" required placeholder="First Last">
      </div>

      <div class="form-group">
        <label for="agentPhone">Phone *</label>
        <input type="tel" id="agentPhone" name="agentPhone" required placeholder="+1XXXXXXXXXX">
      </div>

      <div class="form-group">
        <label for="agentEmail">Email *</label>
        <input type="email" id="agentEmail" name="agentEmail" required>
      </div>

      <div class="form-group">
        <label for="listingAddress">Listing Address *</label>
        <input type="text" id="listingAddress" name="listingAddress" required placeholder="Full street address">
      </div>

      <div class="form-group">
        <label for="squareFootage">Square Footage <span class="label-sub">(above ground)</span></label>
        <input type="number" id="squareFootage" name="squareFootage" placeholder="e.g. 2500" min="0">
      </div>

      <div class="form-group">
        <label for="serviceType">Package / Service *</label>
        <select id="serviceType" name="serviceType" required>
          <option value="">Select a package...</option>
        </select>
      </div>

      <div class="duration-display" id="durationDisplay">
        Estimated on-site time: <strong id="durationValue">—</strong>
      </div>

      <div class="form-group" style="margin-top:18px;">
        <label>Timing *</label>
        <div class="radio-group">
          <label><input type="radio" name="timing" value="Next Available" required checked> Next Available</label>
          <label><input type="radio" name="timing" value="Specific Dates"> Specific Dates</label>
        </div>
      </div>

      <div class="date-range" id="dateRange">
        <div class="form-group">
          <label for="dateRangeStart">From</label>
          <input type="date" id="dateRangeStart" name="dateRangeStart">
        </div>
        <div class="form-group">
          <label for="dateRangeEnd">To</label>
          <input type="date" id="dateRangeEnd" name="dateRangeEnd">
        </div>
      </div>

      <button type="submit" id="submitBtn">Join the Waitlist</button>
    </form>

    <div class="success" id="success">
      <h2>You're on the list!</h2>
      <p id="successMsg"></p>
      <p style="margin-top:12px; font-size:13px; color:#666;">You'll get a confirmation text shortly. We'll notify you the moment a matching slot opens up.</p>
    </div>

    <p class="note">Questions? Call 412-709-5227</p>
  </div>

  <script>
    let services = [];

    // Load services from API
    fetch('/waitlist/services')
      .then(r => r.json())
      .then(data => {
        services = data;
        const select = document.getElementById('serviceType');
        data.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.name;
          opt.textContent = s.name + ' (' + s.baseDuration + ' min)';
          select.appendChild(opt);
        });
      });

    // Duration calculation
    const sqFtInput = document.getElementById('squareFootage');
    const serviceSelect = document.getElementById('serviceType');
    const durationDiv = document.getElementById('durationDisplay');
    const durationVal = document.getElementById('durationValue');

    const scanHeavy = ['Matterport Package', 'Matterport 3D Tour', 'Commercial Package', 'Luxury Listing Bundle'];

    function calcDuration() {
      const svc = services.find(s => s.name === serviceSelect.value);
      if (!svc) { durationDiv.classList.remove('visible'); return; }

      let dur = svc.baseDuration;
      const sqft = parseInt(sqFtInput.value || '0');

      if (scanHeavy.includes(svc.name)) {
        if (sqft >= 5000) dur += 30;
        else if (sqft >= 4000) dur += 15;
      } else {
        if (sqft >= 4000) dur += 15;
        else if (sqft >= 3000) dur += 10;
      }

      durationVal.textContent = dur + ' min';
      durationDiv.classList.add('visible');
    }

    serviceSelect.addEventListener('change', calcDuration);
    sqFtInput.addEventListener('input', calcDuration);

    // Date range toggle
    document.querySelectorAll('input[name="timing"]').forEach(r => {
      r.addEventListener('change', e => {
        document.getElementById('dateRange').classList.toggle('visible', e.target.value === 'Specific Dates');
      });
    });

    // Form submit
    const form = document.getElementById('signupForm');
    const errorDiv = document.getElementById('error');
    const dupDiv = document.getElementById('duplicate');
    const successDiv = document.getElementById('success');
    const submitBtn = document.getElementById('submitBtn');

    // Get source from URL
    const urlParams = new URLSearchParams(window.location.search);
    const source = urlParams.get('src') || 'Website';

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      dupDiv.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Joining...';

      const data = Object.fromEntries(new FormData(form));
      data.source = source;

      try {
        const res = await fetch('/waitlist/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        const result = await res.json();

        if (res.status === 409) {
          dupDiv.textContent = result.error;
          dupDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Join the Waitlist';
          return;
        }

        if (!res.ok) throw new Error(result.error || 'Failed to join');

        form.style.display = 'none';
        durationDiv.style.display = 'none';
        successDiv.style.display = 'block';
        document.getElementById('successMsg').textContent =
          data.agentName + ' — ' + data.serviceType + ' at ' + data.listingAddress + ' (' + result.entry.id + ')';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Join the Waitlist';
      }
    });
  </script>
</body>
</html>
